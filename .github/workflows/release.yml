# Publishes each version tag, which arrives with its release commit, to npm with trusted publishing and provenance, then as a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # A publishing job never restores a cache that other runs could have written.
          package-manager-cache: false
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm install
      - run: npm run build
      - run: npm publish --access public

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The notes list the commits since the previous version, without the release commit itself.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          git log --no-merges --format='- %s' "${previous:+${previous}..}${TAG}" | grep -v '^- chore: release ' > notes.md || true
          gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file notes.md
